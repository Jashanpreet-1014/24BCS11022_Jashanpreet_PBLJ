<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-content py-5">
    <!-- Header & Search -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h2 class="fw-bold mb-1">Explore Menu</h2>
            <p class="text-muted mb-0">Select your favorite dishes and add them to your cart</p>
        </div>
        <form th:action="@{/customer/menu}" method="get" class="d-flex" style="max-width: 350px; width: 100%;">
            <input type="text" name="search" class="form-control me-2" placeholder="Search dish or category..." th:value="${searchQuery}">
            <button type="submit" class="btn btn-danger">Search</button>
        </form>
    </div>

    <!-- Alert Notifications -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Food Cards Grid -->
    <div th:if="${#lists.isEmpty(foods)}" class="text-center py-5">
        <div class="fs-1 text-muted">🔍</div>
        <h4 class="fw-semibold text-muted mt-2">No food items found</h4>
        <p class="text-muted">Try searching with a different keyword.</p>
        <a th:href="@{/customer/menu}" class="btn btn-outline-danger btn-sm mt-2">Reset Menu</a>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(foods)}">
        <div class="col-md-6 col-lg-4" th:each="food : ${foods}">
            <div class="card h-100 food-card">
                <img th:src="${food.imageUrl != null and !food.imageUrl.isEmpty() ? food.imageUrl : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80'}"
                     class="card-img-top food-img" th:alt="${food.name}">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title fw-bold mb-0" th:text="${food.name}">Food Name</h5>
                        <span class="badge bg-danger rounded-pill" th:text="${food.category}">Category</span>
                    </div>
                    <p class="card-text text-muted small flex-grow-1" th:text="${food.description}">Description</p>
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                        <span class="fs-4 fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(food.price, 1, 2)}">₹0.00</span>
                        
                        <form th:action="@{/customer/cart/add}" method="post" class="d-flex align-items-center gap-2">
                            <input type="hidden" name="foodId" th:value="${food.id}">
                            <input type="number" name="quantity" value="1" min="1" max="20" class="form-control form-control-sm" style="width: 60px;">
                            <button type="submit" class="btn btn-danger btn-sm px-3 fw-semibold">Add +</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
