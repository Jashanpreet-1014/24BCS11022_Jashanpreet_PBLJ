<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-content py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1" th:text="'Order #' + ${order.id}">Order #1</h2>
            <p class="text-muted mb-0" th:text="'Placed on ' + ${#temporals.format(order.orderDate, 'dd-MMM-yyyy HH:mm')}">Date</p>
        </div>
        <a th:href="@{/customer/orders}" class="btn btn-outline-secondary">← Back to Orders</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Order Items -->
        <div class="col-lg-8">
            <div class="card p-4 shadow-sm mb-4">
                <h5 class="fw-bold mb-3 border-bottom pb-2">Ordered Items</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Food Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="${item.food.imageUrl != null and !item.food.imageUrl.isEmpty() ? item.food.imageUrl : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&q=80'}"
                                         class="rounded" style="width: 45px; height: 45px; object-fit: cover;" th:alt="${item.food.name}">
                                    <span class="fw-semibold" th:text="${item.food.name}">Food Name</span>
                                </div>
                            </td>
                            <td th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 2)}">₹0.00</td>
                            <td th:text="${item.quantity}">1</td>
                            <td class="fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">₹0.00</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Order Summary & Status -->
        <div class="col-lg-4">
            <div class="card p-4 shadow-sm">
                <h5 class="fw-bold mb-3 border-bottom pb-2">Order Status</h5>
                
                <div class="text-center py-3 mb-3 bg-light rounded">
                    <span class="badge py-2 px-4 fs-6"
                          th:classappend="'badge-status-' + ${order.status}"
                          th:text="${order.status}">PENDING</span>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Total Items:</span>
                    <span class="fw-semibold" th:text="${order.orderItems.size()}">0</span>
                </div>
                <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                    <span class="text-muted">Payment Method:</span>
                    <span class="fw-semibold text-primary">Cash on Delivery</span>
                </div>
                <div class="d-flex justify-content-between fs-5 mb-3">
                    <span class="fw-bold">Grand Total:</span>
                    <span class="fw-bold text-danger" th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
