<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-content py-5">
    <h2 class="fw-bold mb-4">Shopping Cart</h2>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Empty Cart -->
    <div th:if="${cart == null or #lists.isEmpty(cart.items)}" class="text-center py-5 card p-5">
        <div class="fs-1 text-muted mb-3">🛒</div>
        <h4 class="fw-bold text-muted">Your cart is currently empty</h4>
        <p class="text-muted">Looks like you haven't added anything to your cart yet.</p>
        <div>
            <a th:href="@{/customer/menu}" class="btn btn-danger px-4 py-2 mt-2">Browse Food Menu</a>
        </div>
    </div>

    <!-- Cart Table & Summary -->
    <div class="row g-4" th:if="${cart != null and !#lists.isEmpty(cart.items)}">
        <div class="col-lg-8">
            <div class="card p-4 shadow-sm">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cart.items}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="${item.imageUrl != null and !item.imageUrl.isEmpty() ? item.imageUrl : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&q=80'}"
                                         class="rounded" style="width: 50px; height: 50px; object-fit: cover;" th:alt="${item.foodName}">
                                    <span class="fw-semibold" th:text="${item.foodName}">Food Name</span>
                                </div>
                            </td>
                            <td th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 2)}">₹0.00</td>
                            <td>
                                <form th:action="@{/customer/cart/update}" method="post" class="d-flex align-items-center gap-2">
                                    <input type="hidden" name="foodId" th:value="${item.foodId}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="1" max="50"
                                           class="form-control form-control-sm" style="width: 65px;" onchange="this.form.submit()">
                                </form>
                            </td>
                            <td class="fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">₹0.00</td>
                            <td>
                                <form th:action="@{/customer/cart/remove}" method="post">
                                    <input type="hidden" name="foodId" th:value="${item.foodId}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">Remove</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Order Summary Card -->
        <div class="col-lg-4">
            <div class="card p-4 shadow-sm">
                <h4 class="fw-bold mb-3 border-bottom pb-2">Order Summary</h4>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Total Items:</span>
                    <span class="fw-semibold" th:text="${cart.totalItems}">0</span>
                </div>
                <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                    <span class="text-muted">Delivery Fee:</span>
                    <span class="text-success fw-semibold">FREE</span>
                </div>

                <div class="d-flex justify-content-between mb-4 fs-5">
                    <span class="fw-bold">Total Amount:</span>
                    <span class="fw-bold text-danger" th:text="'₹' + ${#numbers.formatDecimal(cart.totalAmount, 1, 2)}">₹0.00</span>
                </div>

                <form th:action="@{/customer/checkout}" method="post">
                    <button type="submit" class="btn btn-danger w-100 py-3 fw-bold fs-6 shadow">Place Order & Checkout</button>
                </form>

                <a th:href="@{/customer/menu}" class="btn btn-outline-secondary w-100 mt-2">Continue Shopping</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
