<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Restaurant Ordering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-content d-flex align-items-center justify-content-center py-5">
    <div class="card shadow-lg p-5 text-center" style="max-width: 500px; width: 100%;">
        <div class="mb-3 display-1 text-danger">⚠️</div>
        <h3 class="fw-bold mb-3">Oops! Something went wrong</h3>
        <p class="text-muted mb-4" th:text="${errorMessage}">An error occurred.</p>
        <div>
            <a th:href="@{/}" class="btn btn-primary px-4 py-2">Go to Homepage</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
