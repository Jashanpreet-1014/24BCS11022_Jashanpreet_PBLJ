<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-custom-dark shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="fs-4 me-2">🍔</span>
            <span>FoodExpress</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <!-- Anonymous Links -->
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="nav-link text-white" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="btn btn-outline-light btn-sm rounded-pill px-3" th:href="@{/register}">Register</a>
                </li>

                <!-- Customer Navigation -->
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'CUSTOMER'}">
                    <a class="nav-link text-white" th:href="@{/customer/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'CUSTOMER'}">
                    <a class="nav-link text-white" th:href="@{/customer/menu}">Menu</a>
                </li>
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'CUSTOMER'}">
                    <a class="nav-link text-white position-relative" th:href="@{/customer/cart}">
                        🛒 Cart
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:if="${session.cart != null and session.cart.totalItems > 0}"
                              th:text="${session.cart.totalItems}">0</span>
                    </a>
                </li>
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'CUSTOMER'}">
                    <a class="nav-link text-white" th:href="@{/customer/orders}">My Orders</a>
                </li>

                <!-- Admin Navigation -->
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'ADMIN'}">
                    <a class="nav-link text-white" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'ADMIN'}">
                    <a class="nav-link text-white" th:href="@{/admin/food}">Manage Menu</a>
                </li>
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'ADMIN'}">
                    <a class="nav-link text-white" th:href="@{/admin/orders}">Orders</a>
                </li>
                <li class="nav-item" th:if="${session.user != null and session.user.role.name() == 'ADMIN'}">
                    <a class="nav-link text-white" th:href="@{/admin/users}">Users</a>
                </li>

                <!-- User Profile & Logout -->
                <li class="nav-item ms-lg-3" th:if="${session.user != null}">
                    <span class="badge bg-secondary me-2 py-2 px-3 fw-normal" th:text="${session.user.fullName}">User</span>
                    <a class="btn btn-outline-warning btn-sm rounded-pill px-3" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
