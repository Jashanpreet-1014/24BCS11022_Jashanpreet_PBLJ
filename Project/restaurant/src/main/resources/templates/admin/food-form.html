<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Admin'">Food Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-content py-5">
    <div class="d-flex justify-content-between align-items-center mb-4" style="max-width: 600px; margin: 0 auto;">
        <h2 class="fw-bold mb-0" th:text="${pageTitle}">Food Item Form</h2>
        <a th:href="@{/admin/food}" class="btn btn-outline-secondary">← Back to Menu</a>
    </div>

    <div class="card shadow p-4" style="max-width: 600px; margin: 0 auto;">
        <form th:action="@{/admin/food/save}" th:object="${food}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Food Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="e.g. Paneer Butter Masala" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label fw-semibold">Category</label>
                <select class="form-select" id="category" th:field="*{category}" required>
                    <option value="">-- Select Category --</option>
                    <option value="Starters">Starters</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Pizza">Pizza</option>
                    <option value="Burgers">Burgers</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Desserts">Desserts</option>
                    <option value="Beverages">Beverages</option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category Error</div>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label fw-semibold">Price (₹)</label>
                <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" placeholder="250.00" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Brief description of ingredients..."></textarea>
            </div>

            <div class="mb-3">
                <label for="imageUrl" class="form-label fw-semibold">Image URL</label>
                <input type="url" class="form-control" id="imageUrl" th:field="*{imageUrl}" placeholder="https://example.com/image.jpg">
                <div class="form-text">Provide a web image URL for the dish thumbnail.</div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="available" th:field="*{available}">
                <label class="form-check-label fw-semibold" for="available">Available for ordering</label>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Save Food Item</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
