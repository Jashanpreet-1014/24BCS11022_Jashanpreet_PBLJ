<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-content py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Registered Users</h2>
            <p class="text-muted mb-0">List of all registered customers and administrators</p>
        </div>
    </div>

    <div class="card p-4 shadow-sm">
        <div th:if="${#lists.isEmpty(users)}" class="text-center py-4 text-muted">
            <p class="mb-0">No users found.</p>
        </div>

        <div class="table-responsive" th:if="${!#lists.isEmpty(users)}">
            <table class="table align-middle table-hover">
                <thead class="table-light">
                <tr>
                    <th>User ID</th>
                    <th>Full Name</th>
                    <th>Email Address</th>
                    <th>Phone</th>
                    <th>Role</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td class="fw-bold" th:text="'#' + ${user.id}">#1</td>
                    <td>
                        <div class="fw-semibold" th:text="${user.fullName}">Name</div>
                    </td>
                    <td th:text="${user.email}">Email</td>
                    <td th:text="${user.phone}">Phone</td>
                    <td>
                        <span class="badge py-2 px-3"
                              th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                              th:text="${user.role}">CUSTOMER</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
