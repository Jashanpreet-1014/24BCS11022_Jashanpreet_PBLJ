<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container main-content py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Food Menu Management</h2>
            <p class="text-muted mb-0">Add, edit, toggle, or remove dishes</p>
        </div>
        <a th:href="@{/admin/food/add}" class="btn btn-danger">+ Add New Food Item</a>
    </div>

    <!-- Alert Notifications -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card p-4 shadow-sm">
        <div th:if="${#lists.isEmpty(foods)}" class="text-center py-4 text-muted">
            <p class="mb-0">No food items added yet. Click "+ Add New Food Item" to create one.</p>
        </div>

        <div class="table-responsive" th:if="${!#lists.isEmpty(foods)}">
            <table class="table align-middle table-hover">
                <thead class="table-light">
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="food : ${foods}">
                    <td>
                        <img th:src="${food.imageUrl != null and !food.imageUrl.isEmpty() ? food.imageUrl : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&q=80'}"
                             class="rounded" style="width: 50px; height: 50px; object-fit: cover;" th:alt="${food.name}">
                    </td>
                    <td>
                        <div class="fw-bold" th:text="${food.name}">Food Name</div>
                        <div class="text-muted small" th:text="${food.description}">Description</div>
                    </td>
                    <td>
                        <span class="badge bg-secondary" th:text="${food.category}">Category</span>
                    </td>
                    <td class="fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(food.price, 1, 2)}">₹0.00</td>
                    <td>
                        <span class="badge" th:classappend="${food.available} ? 'bg-success' : 'bg-secondary'"
                              th:text="${food.available} ? 'Available' : 'Unavailable'">Available</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/admin/food/edit/{id}(id=${food.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <a th:href="@{/admin/food/toggle/{id}(id=${food.id})}" class="btn btn-sm btn-outline-warning text-dark">Toggle</a>
                            <a th:href="@{/admin/food/delete/{id}(id=${food.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this food item?')">Delete</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
